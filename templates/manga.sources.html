<section class="manga-sources settings-body body-medium" aria-label="{{language.mangaSources.title}}">
	<h1 class="display-medium">{{language.mangaSources.title}}</h1>
	<p class="ms-subtitle">{{language.mangaSources.subtitle}}</p>
	<nav class="ms-tabs" aria-label="{{language.mangaSources.title}}">
		<button class="simple-button filled-tonal gamepad-item" data-tab="sources">{{language.mangaSources.sources}}</button>
		<button class="simple-button filled-tonal gamepad-item" data-tab="extensions">{{language.mangaSources.extensions}}</button>
		<button class="simple-button filled-tonal gamepad-item" data-tab="repositories">{{language.mangaSources.repositories}}</button>
	</nav>
	<div class="ms-status" role="status" aria-live="polite"></div>
	<div class="ms-error" role="alert" hidden><p></p><button class="simple-button filled-tonal" data-action="retry">{{language.mangaSources.retry}}</button></div>
	<div class="ms-content"></div>
	<p class="ms-footer">{{language.mangaSources.sourceEngine}}</p>
</section>
